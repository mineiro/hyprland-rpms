name: COPR Smoke Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '40 9 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora_version:
          - "43"
          - "44"
          - rawhide
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora_version }}
    env:
      COPR_OWNER: ${{ vars.COPR_OWNER }}
      COPR_PROJECT: ${{ vars.COPR_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate repo variables
        run: |
          test -n "${COPR_OWNER}" || { echo "Set repository variable COPR_OWNER"; exit 1; }
          test -n "${COPR_PROJECT}" || { echo "Set repository variable COPR_PROJECT"; exit 1; }
          printf '%s' "${COPR_OWNER}" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "COPR_OWNER contains invalid characters"; exit 1; }
          printf '%s' "${COPR_PROJECT}" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "COPR_PROJECT contains invalid characters"; exit 1; }

      - name: Run COPR smoke test
        run: |
          bash ./scripts/copr-smoke-tests.sh --inside-container

  report:
    needs: smoke
    if: ${{ always() && needs.smoke.result != 'cancelled' && needs.smoke.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Open, update, or close the tracking issue
        run: |
          if [ "${{ needs.smoke.result }}" = success ]; then
            ./scripts/ci-issue.sh alert ci-smoke "COPR smoke tests are failing" passing
          else
            ./scripts/ci-issue.sh run-summary > "${RUNNER_TEMP}/body.md"
            ./scripts/ci-issue.sh alert ci-smoke "COPR smoke tests are failing" failing "${RUNNER_TEMP}/body.md"
          fi
