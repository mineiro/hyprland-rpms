name: Repoclosure

on:
  workflow_dispatch:
  schedule:
    - cron: '20 9 * * *'

permissions:
  contents: read

concurrency:
  group: repoclosure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repoclosure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        fedora_version:
          - "43"
          - "44"
          - rawhide
    container:
      image: registry.fedoraproject.org/fedora:${{ matrix.fedora_version }}
    env:
      COPR_OWNER: ${{ vars.COPR_OWNER }}
      COPR_PROJECT: ${{ vars.COPR_PROJECT }}
    steps:
      - name: Validate repo variables
        run: |
          test -n "${COPR_OWNER}" || { echo "Set repository variable COPR_OWNER"; exit 1; }
          test -n "${COPR_PROJECT}" || { echo "Set repository variable COPR_PROJECT"; exit 1; }
          printf '%s' "${COPR_OWNER}" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "COPR_OWNER contains invalid characters"; exit 1; }
          printf '%s' "${COPR_PROJECT}" | grep -Eq '^[A-Za-z0-9._-]+$' || { echo "COPR_PROJECT contains invalid characters"; exit 1; }

      - name: Add COPR repo file
        run: |
          cat > /etc/yum.repos.d/copr-hyprwm.repo <<EOF
          [copr:${COPR_OWNER}:${COPR_PROJECT}]
          name=COPR ${COPR_OWNER}/${COPR_PROJECT}
          baseurl=https://download.copr.fedorainfracloud.org/results/${COPR_OWNER}/${COPR_PROJECT}/fedora-\$releasever-\$basearch/
          type=rpm-md
          skip_if_unavailable=False
          gpgcheck=1
          gpgkey=https://download.copr.fedorainfracloud.org/results/${COPR_OWNER}/${COPR_PROJECT}/pubkey.gpg
          repo_gpgcheck=0
          enabled=1
          enabled_metadata=1
          EOF

      - name: Repoclosure
        run: |
          repo_id="copr:${COPR_OWNER}:${COPR_PROJECT}"
          dnf -y --disablerepo="${repo_id}" --setopt=install_weak_deps=0 install dnf-plugins-core
          dnf -q --refresh --repo="${repo_id}" makecache

          # Retired 0.53 plugin subpackages can remain in COPR metadata after
          # the 0.55 plugin family replaces them; current plugin packages are
          # still included in the check.
          set +e
          dnf -q --refresh \
            --exclude="hyprland-plugin-hyprexpo*" \
            --exclude="hyprland-plugin-hyprscrolling*" \
            --exclude="hyprland-plugin-hyprtrails*" \
            --exclude="hyprland-plugin-hyprwinwrap*" \
            --exclude="hyprland-plugin-xtra-dispatchers*" \
            repoclosure --check "${repo_id}" --newest --best > /tmp/repoclosure.log 2>&1
          status=$?
          set -e
          cat /tmp/repoclosure.log

          if [ "${status}" -ne 0 ]; then
            {
              echo "### Repoclosure failed for Fedora ${{ matrix.fedora_version }}"
              echo
              echo '```text'
              sed -n '/^package:/,$p' /tmp/repoclosure.log
              echo '```'
              echo
              echo "Packages listed above normally need a same-version Release bump and COPR rebuild after a Fedora ABI transition."
            } >> "${GITHUB_STEP_SUMMARY}"

            awk '/^package:/ { print $2 }' /tmp/repoclosure.log | sort -u | while read -r package_nevra; do
              [ -n "${package_nevra}" ] && echo "::error title=Broken repository package::${package_nevra} has unresolved dependencies on Fedora ${{ matrix.fedora_version }}"
            done
          fi

          exit "${status}"
